name: Windows .exe 빌드

# 태그를 붙이면 릴리스에 올리고, 그 외에는 아티팩트로만 남긴다.
# 수동 실행(workflow_dispatch)으로 아무 브랜치나 빌드해 볼 수 있다.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    # 로직 검증은 리눅스에서 먼저 돌려 빌드 자원을 아낀다. wx가 필요 없는 테스트만 여기서 돈다.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # Windows 잡과 같은 버전으로 맞춘다. setup-python이 설치한 Python은
          # 배포판 관리 대상이 아니라 pip 설치가 막히지 않는다.
          python-version: "3.14"
      - name: 의존성 설치
        # wxPython 리눅스 휠은 배포판별 빌드가 필요해 여기서는 설치하지 않는다.
        # 아래 테스트는 wx를 import하지 않는 domain/application/adapter 계층만 다룬다.
        #
        # uv pip install --system은 쓰지 않는다. 러너의 시스템 Python은 PEP 668로
        # 보호돼 있어 externally-managed-environment 오류로 실패한다.
        run: python -m pip install --upgrade pip pytest
      - name: 비 GUI 테스트
        env:
          PYTHONPATH: src
          # 인코딩을 명시하지 않은 파일 입출력을 오류로 잡는다. 생략하면 로케일이
          # UTF-8인 개발 환경에서는 통과하고 Windows(cp1252)에서만 깨진다.
          PYTHONWARNDEFAULTENCODING: "1"
        run: python -W error::EncodingWarning -m pytest tests/test_core.py tests/test_nmea.py tests/test_robot.py tests/test_startup.py -q

  build-windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # wxPython 4.3.1과 PyInstaller 모두 3.14 Windows 휠을 제공한다.
          python-version: "3.14"

      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          python -m pip install wxPython==4.3.1 pyinstaller==6.22.3 pytest

      - name: 전체 테스트
        # Windows 러너에는 wx가 설치돼 있어 UI 계층까지 import된다.
        env:
          PYTHONPATH: src
          # 실제 cp1252 환경이다. 인코딩 미지정 입출력을 여기서도 오류로 잡는다.
          PYTHONWARNDEFAULTENCODING: "1"
        run: python -W error::EncodingWarning -m pytest -q

      - name: .exe 빌드
        run: pyinstaller packaging/mechlab.spec --noconfirm

      - name: 경로 해석 확인
        # 번들된 .exe가 asset을 찾고, 지도 폴더를 .exe 옆에서 읽는지 확인한다.
        # --print-paths와 --self-check는 GUI를 띄우지 않는다.
        shell: pwsh
        run: |
          # 콘솔 출력 코드 페이지가 cp1252면 아래 Write-Host의 한글이 ?로 깨진다.
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          $exe = Join-Path (Get-Location) "dist\MECHLab.exe"
          if (-not (Test-Path $exe)) { throw "빌드 산출물이 없습니다: $exe" }
          # windowed 빌드(console=False)는 `&`로 실행하면 PowerShell이 종료를
          # 기다리지 않고 $LASTEXITCODE도 설정되지 않는다. Start-Process -Wait를 쓴다.
          # 경로는 절대 경로로 준다. Start-Process는 .NET 작업 디렉터리를 기준으로
          # 상대 경로를 풀기 때문에 PowerShell의 현재 위치와 어긋날 수 있다.
          $report = Join-Path (Get-Location) "paths.txt"
          $p = Start-Process -FilePath $exe -ArgumentList '--print-paths','--report',"`"$report`"" `
                 -WorkingDirectory (Get-Location) -Wait -PassThru -NoNewWindow
          if ($p.ExitCode -ne 0) { throw "--print-paths 실패 (종료 코드 $($p.ExitCode))" }
          if (-not (Test-Path $report)) { throw "--print-paths가 결과 파일을 쓰지 못했습니다" }
          # 보고 파일은 UTF-8이다. 기본 인코딩으로 읽으면 한글이 깨져 판정이 어긋난다.
          $out = Get-Content $report -Raw -Encoding utf8
          Write-Host $out
          if ($out -notmatch "frozen: True") { throw "frozen 실행으로 인식되지 않았습니다" }
          # 지도 폴더는 .exe와 같은 폴더를 가리켜야 한다. 번들 안(_MEI 임시 폴더)이면 실패다.
          if ($out -match "map_pack_dir: .*_MEI") { throw "지도 폴더가 번들 내부를 가리킵니다" }
          $distFull = (Resolve-Path "dist").Path
          if ($out -notmatch [regex]::Escape($distFull)) { throw "외부 자료 폴더가 .exe 옆이 아닙니다" }

      - name: 번들 자체 점검
        # 글꼴·아이콘이 번들에 들어갔는지, 지도 폴더가 교체 가능한 바깥에 있는지 확인한다.
        # GUI 빌드는 콘솔에 출력하지 못하므로 --report 파일로 결과를 받는다.
        shell: pwsh
        run: |
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          $exe = Join-Path (Get-Location) "dist\MECHLab.exe"
          $report = Join-Path (Get-Location) "check.txt"
          $p = Start-Process -FilePath $exe -ArgumentList '--self-check','--report',"`"$report`"" `
                 -WorkingDirectory (Get-Location) -Wait -PassThru -NoNewWindow
          if (Test-Path $report) { Get-Content $report -Encoding utf8 | Write-Host }
          else { throw "--self-check가 결과 파일을 쓰지 못했습니다" }
          if ($p.ExitCode -ne 0) { throw "번들 자체 점검 실패 (종료 코드 $($p.ExitCode))" }

      - name: 빈 자료 폴더에서 창이 뜨는지 확인
        # 배포 zip의 maps/nmea는 안내 파일만 든 빈 폴더다. 예전에는 이 상태에서
        # GUI 전에 종료 코드 2로 끝나 사용자에게는 '반응 없음'으로만 보였다.
        # windowed 빌드는 콘솔이 없어 이 증상을 exe 옆 시작 로그로만 확인할 수 있다.
        shell: pwsh
        run: |
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          $dist = (Resolve-Path "dist").Path
          New-Item -ItemType Directory -Force -Path "$dist\maps", "$dist\nmea" | Out-Null
          $log = Join-Path $dist "MECHLab-시작로그.txt"
          Remove-Item $log -ErrorAction SilentlyContinue
          $p = Start-Process -FilePath (Join-Path $dist "MECHLab.exe") `
                 -WorkingDirectory $dist -PassThru
          # 창이 뜬 뒤에도 살아 있어야 한다. 조용히 종료하면 아래에서 잡힌다.
          Start-Sleep -Seconds 20
          $exited = $p.HasExited
          $code = if ($exited) { $p.ExitCode } else { "(실행 중)" }
          if (-not $exited) { Stop-Process -Id $p.Id -Force }
          if (Test-Path $log) { Get-Content $log -Raw -Encoding utf8 | Write-Host }
          else { throw "시작 로그가 없습니다. GUI 단계 전에 종료됐습니다." }
          if ($exited) { throw "창이 유지되지 않고 종료됐습니다 (종료 코드 $code)" }

      - name: 배포 폴더 구성
        # 사용자가 받는 zip 구조를 여기서 만든다. 지도와 NMEA는 빈 폴더와 안내만 넣는다.
        shell: pwsh
        run: |
          $stage = "release\MECHLab"
          New-Item -ItemType Directory -Force -Path "$stage\maps", "$stage\nmea" | Out-Null
          Copy-Item "dist\MECHLab.exe" $stage
          Copy-Item "packaging\배포_읽어보기.txt" "$stage\읽어보기.txt"
          # 빈 폴더는 zip에서 사라지므로 안내 파일을 하나씩 둔다.
          Set-Content "$stage\maps\여기에_지도팩을_넣으세요.txt" `
            "이 폴더에 .mbtiles 타일팩을 넣으면 앱이 지도 배경을 표시합니다. 파일이 없으면 좌표와 궤적만 표시합니다." -Encoding utf8
          Set-Content "$stage\nmea\여기에_NMEA_로그를_넣으세요.txt" `
            "재생할 .nmea 로그를 이 폴더에 넣으세요. 10km_log.nmea가 있으면 그 파일을 먼저 사용합니다." -Encoding utf8
          Compress-Archive -Path $stage -DestinationPath "release\MECHLab-windows.zip"

      - name: 아티팩트 업로드
        uses: actions/upload-artifact@v4
        with:
          name: MECHLab-windows
          path: release/MECHLab-windows.zip
          retention-days: 30

  release:
    # 태그 푸시에서만 릴리스를 만든다.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: MECHLab-windows
      - uses: softprops/action-gh-release@v2
        with:
          files: MECHLab-windows.zip
